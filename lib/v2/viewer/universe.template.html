/* 레이아웃: 화면 전체가 하나의 우주(three.js). 그 위에 유리 질감의 얇은 층 — 위 경로·조작, 오른쪽(휴대폰은 아래) 패널, 아래 범례 */
:root {
  color-scheme: dark;
  --void: #02030a;
  --ink: #eef2fb;
  --ink-2: #b4bdd4;
  --ink-3: #79829d;
  --hair: rgba(206, 218, 255, 0.11);
  --hair-2: rgba(206, 218, 255, 0.06);
  --glass: rgba(12, 16, 33, 0.56);
  --glass-hi: rgba(20, 26, 50, 0.72);
  --glass-edge: rgba(255, 255, 255, 0.075);
  --neg: #ff7262;
  --pos: #ffd27c;
  --neb: #b394ff;
  --dust: #9fabcb;
  --polar: #d8ecff;
  --gold: #d9b67b;
  --amber: #f1a75e;
  --f-ui: "Gmarket Sans", "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-prose: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans CJK KR", "PingFang SC", "Hiragino Sans", "Microsoft YaHei", system-ui, sans-serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-io: cubic-bezier(0.77, 0, 0.175, 1);
  --panel-w: 384px;
}
html, body { height: 100%; margin: 0; background: var(--void); color: var(--ink); overflow: hidden; overscroll-behavior: none; }
body { font: 400 14px/1.5 var(--f-ui); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
* { box-sizing: border-box; }

#app { position: fixed; inset: 0; overflow: hidden; background: var(--void); touch-action: none; user-select: none; -webkit-user-select: none; }
#sky0 { position: absolute; inset: 0; width: 100%; height: 100%; transition: opacity 1.1s var(--ease-out); }
#sky0.gone { opacity: 0; }
#gl { position: absolute; inset: 0; }
#gl canvas { display: block; width: 100%; height: 100%; outline: none; }
#gl.grab canvas { cursor: grab; }
#gl.dragging canvas { cursor: grabbing; }
#gl.point canvas { cursor: pointer; }
#veil { position: absolute; inset: 0; background: #02030a; opacity: 0; pointer-events: none; transition: opacity 0.22s ease; }
#veil.on { opacity: 1; }

/* 유리 */
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(20px) saturate(150%);
  backdrop-filter: blur(20px) saturate(150%);
  border: 1px solid var(--glass-edge);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 10px 30px rgba(0, 0, 0, 0.35);
}

/* 위 */
.hud-top {
  position: absolute; left: 0; right: 0; top: 0; z-index: 5;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px 0;
  pointer-events: none;
}
.hud-top > * { pointer-events: auto; }
.crumbs { display: flex; align-items: center; min-width: 0; height: 38px; padding: 0 6px; border-radius: 999px; overflow: hidden; }
.crumbs button, .crumbs .cur {
  border: 0; background: none; height: 30px; padding: 0 10px; border-radius: 999px; white-space: nowrap;
  font-size: 13px; font-weight: 500; letter-spacing: -0.01em; color: var(--ink-2); cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px; min-width: 0; overflow: hidden; text-overflow: ellipsis;
  transition: background-color 0.16s ease, color 0.16s ease;
}
.crumbs .cur { color: var(--ink); font-weight: 600; cursor: default; display: inline-block; line-height: 30px; }
.crumbs .cur-btn { color: var(--ink); font-weight: 600; box-shadow: inset 0 0 0 1px var(--hair); }
.crumbs .sep { color: var(--ink-3); font-size: 12px; flex: none; }
.crumbs .home-ico { width: 14px; height: 14px; color: var(--polar); flex: none; }
.crumbs .back { width: 30px; padding: 0; justify-content: center; flex: none; color: var(--ink); }
.crumbs .back svg { width: 16px; height: 16px; }
@media (hover: hover) and (pointer: fine) {
  .crumbs button:hover { background: rgba(255, 255, 255, 0.07); color: var(--ink); }
}
.crumbs button:active { background: rgba(255, 255, 255, 0.1); }

.tools { display: flex; align-items: center; gap: 8px; flex: none; }
.btn {
  height: 38px; padding: 0 14px 0 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 7px;
  font-size: 13px; font-weight: 500; letter-spacing: -0.01em; color: var(--ink); cursor: pointer;
  transition: transform 0.12s var(--ease-out), background-color 0.16s ease, border-color 0.16s ease;
}
.btn svg { width: 16px; height: 16px; flex: none; }
.btn:active { transform: scale(0.97); }
.btn[aria-pressed="false"] { color: var(--ink-2); }
.btn[aria-pressed="false"] svg { opacity: 0.55; }
#btn-home svg { color: var(--polar); }
@media (hover: hover) and (pointer: fine) { .btn:hover { background: var(--glass-hi); } }

.seg { position: relative; display: flex; height: 38px; padding: 3px; border-radius: 999px; }
.seg button {
  position: relative; z-index: 1; border: 0; background: none; height: 30px; padding: 0 13px; border-radius: 999px;
  font-size: 13px; font-weight: 500; letter-spacing: -0.01em; color: var(--ink-2); cursor: pointer; white-space: nowrap;
  transition: color 0.18s ease;
}
.seg button[aria-checked="true"] { color: #0b0f1d; font-weight: 600; }
.seg-ind {
  position: absolute; top: 3px; left: 0; height: 30px; width: 40px; border-radius: 999px; background: #e9eefb;
  box-shadow: 0 1px 8px rgba(160, 190, 255, 0.25); transition: transform 0.26s var(--ease-out), width 0.26s var(--ease-out);
}
.sample-tag {
  height: 26px; padding: 0 10px; border-radius: 999px; display: inline-flex; align-items: center;
  font-size: 12px; font-weight: 600; color: var(--amber); border: 1px solid rgba(241, 167, 94, 0.45); background: rgba(241, 167, 94, 0.08);
}
button:focus-visible { outline: 2px solid var(--polar); outline-offset: 2px; }

/* 라벨(3D 위치를 화면에 투영) */
#labels { position: absolute; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }
.lb { position: absolute; left: 0; top: 0; will-change: transform, opacity; opacity: 0; transition: opacity 0.2s ease; white-space: nowrap; }
.lb > div { transform: translate(-50%, 0); text-align: center; text-shadow: 0 0 10px rgba(2, 3, 10, 0.95), 0 0 2px rgba(2, 3, 10, 0.9); }
.lb.on { opacity: 1; }
.lb.dim { opacity: 0.38; }
.lb.ns > div { transform: translate(-50%, 0); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 30px 10px; background: radial-gradient(closest-side, rgba(2, 3, 10, 0.72), rgba(2, 3, 10, 0)); }
.lb.ns .k { font-size: 12px; font-weight: 500; letter-spacing: 0.01em; color: var(--polar); opacity: 0.86; }
.lb.ns .v { display: inline-flex; align-items: baseline; gap: 6px; }
.lb.ns .v b { font-size: 25px; font-weight: 700; letter-spacing: -0.02em; color: #f4f9ff; }
.lb.ns .v .u { font-size: 14px; color: var(--polar); }
.lb.ns .tag { font-size: 11px; font-weight: 600; color: var(--amber); border: 1px solid rgba(241, 167, 94, 0.5); border-radius: 999px; padding: 1px 7px; }
.lb.gal b { display: block; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; color: var(--gcol, var(--ink)); }
.lb.gal small { display: block; margin-top: 1px; font-size: 11px; font-weight: 500; color: var(--gold); opacity: 0.9; letter-spacing: 0.01em; }
.lb.gal.hot b { color: #fff; }
.lb.con > div { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; color: var(--ccol, var(--ink)); }
.lb.con.seed > div { font-weight: 500; font-size: 12px; opacity: 0.85; }
.lb.con.hot > div, .lb.con.sel > div { color: #fff; }
.lb.con.sel > div { font-size: 15px; }
.lb.mon > div { font-size: 11px; font-weight: 500; color: var(--gold); opacity: 0.85; transform: translate(-50%, -50%); }
.lb.arm > div { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; color: var(--ink); transform: translate(-50%, -50%); }
.lb.arm > div i { display: block; font-style: normal; font-size: 10.5px; font-weight: 500; letter-spacing: 0.02em; color: var(--ink-3); }

/* 패널 */
.panel {
  position: absolute; z-index: 6; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 66px); bottom: 16px; width: var(--panel-w);
  border-radius: 20px; display: flex; flex-direction: column; overflow: hidden;
  background: rgba(10, 13, 28, 0.62);
  -webkit-backdrop-filter: blur(26px) saturate(150%); backdrop-filter: blur(26px) saturate(150%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 24px 70px rgba(0, 0, 0, 0.5);
  transform-origin: 100% 50%;
  transition: transform 0.32s var(--ease-out), opacity 0.24s ease;
}
.panel.enter { opacity: 0; transform: translateX(18px) scale(0.985); }
.panel .grab { display: none; }
.p-close {
  position: absolute; top: 12px; right: 12px; z-index: 2; width: 30px; height: 30px; border-radius: 999px; border: 0;
  background: rgba(255, 255, 255, 0.06); color: var(--ink-2); display: grid; place-items: center; cursor: pointer;
}
.p-close svg { width: 14px; height: 14px; }
@media (hover: hover) and (pointer: fine) { .p-close:hover { background: rgba(255, 255, 255, 0.12); color: var(--ink); } }
.p-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.18) transparent; touch-action: pan-y; }
.p-body { padding: 22px 22px 26px; display: flex; flex-direction: column; gap: 18px; user-select: text; -webkit-user-select: text; }
.p-body.swap { animation: pswap 0.24s var(--ease-out); }
@keyframes pswap { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.eyebrow { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; color: var(--ink-3); letter-spacing: 0.01em; padding-right: 34px; flex-wrap: wrap; }
.eyebrow .id { color: var(--gold); }
.p-title { margin: 6px 0 0; font-size: 23px; line-height: 1.28; font-weight: 700; letter-spacing: -0.025em; text-wrap: balance; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.badge {
  display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px;
  font-size: 12px; font-weight: 600; letter-spacing: -0.005em; border: 1px solid currentColor; white-space: nowrap;
}
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.ghost { color: var(--ink-2); border-color: var(--hair); }
.badge.ghost::before { display: none; }
.c-neg { color: var(--neg); } .c-pos { color: var(--pos); } .c-neb { color: var(--neb); } .c-amber { color: var(--amber); } .c-dust { color: var(--dust); } .c-polar { color: var(--polar); }

.facts { display: grid; grid-template-columns: auto 1fr; gap: 9px 18px; margin: 0; font-size: 13.5px; }
.facts dt { color: var(--ink-3); font-weight: 500; }
.facts dd { margin: 0; color: var(--ink); min-width: 0; }
.facts dd .muted { color: var(--ink-3); }
.num { font-variant-numeric: tabular-nums; }

.bars { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; align-items: end; height: 96px; padding-top: 4px; }
.bars .b { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%; min-width: 0; }
.bars .b i { display: block; width: 100%; max-width: 30px; min-height: 2px; border-radius: 5px 5px 2px 2px; background: currentColor; transform-origin: 50% 100%; animation: grow 0.5s var(--ease-out) both; }
.bars .b b { font-size: 12px; font-weight: 500; color: var(--ink); }
.bars .b span { font-size: 11.5px; color: var(--ink-3); }
.bars .b.zero b { color: transparent; }
.bars .b.zero i { opacity: 0.35; }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }

.summary { margin: 0; font: 400 14.5px/1.65 var(--f-prose); color: var(--ink); letter-spacing: -0.005em; }
.next { display: flex; flex-direction: column; gap: 4px; padding: 13px 14px; border-radius: 12px; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--hair-2); }
.next .k { font-size: 11.5px; font-weight: 500; color: var(--gold); letter-spacing: 0.02em; }
.next .v { font-size: 14px; font-weight: 500; color: var(--ink); line-height: 1.45; }
.next .v .st { color: var(--ink-2); font-weight: 500; }

.sect-k { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 12px; font-weight: 600; color: var(--ink-2); letter-spacing: 0.01em; padding: 0 2px 6px; border-bottom: 1px solid var(--hair-2); }
.sect-k > span { color: var(--ink-3); font-weight: 500; }
.sect-k > .t { color: var(--ink-2); font-weight: 600; }
.sect-k > .t b { margin-left: 6px; color: var(--ink); font-weight: 600; }
.rows { display: flex; flex-direction: column; }
.row {
  display: grid; grid-template-columns: 10px minmax(0, 1fr) auto auto; align-items: center; gap: 10px;
  width: 100%; min-height: 40px; padding: 6px 8px; margin: 0 -8px; width: calc(100% + 16px);

  let gals = (raw.galaxies || []).map((g, i) => ({ ...g, id: galName(g.id || g.name), name: galName(g.name || g.id), order: g.order ?? i }));
  if (!gals.length) gals = GAL_DEFAULT.map((n, i) => ({ id: n, name: n, order: i }));
  gals.sort((a, b) => a.order - b.order);
  const galById = new Map(gals.map((g) => [g.id, g]));

  const stars = (raw.stars || []).filter((s) => s && s.id).map((s) => {
    const g = galName(s.galaxy);
    if (!galById.has(g)) { const ng = { id: g, name: g, order: gals.length }; gals.push(ng); galById.set(g, ng); }
    let day = dayNum(s.date);
    if (isNaN(day)) day = day0;
    return { ...s, galaxy: g, day, polarity: s.polarity === 'pos' ? 'pos' : 'neg', branch: s.branch || branches[0] };
  });
  stars.forEach((s) => { if (!branches.includes(s.branch)) branches.push(s.branch); });
  const starById = new Map(stars.map((s) => [s.id, s]));

  const cons = (raw.constellations || []).filter((c) => c && c.id).map((c) => ({ ...c, galaxy: galName(c.galaxy), polarity: c.polarity === 'pos' ? 'pos' : 'neg' }));
  const conById = new Map(cons.map((c) => [c.id, c]));
  cons.forEach((c) => {
    let ss = (c.star_ids || []).map((id) => starById.get(id)).filter(Boolean);
    if (!ss.length) ss = stars.filter((s) => s.constellation_id === c.id);
    ss.sort((a, b) => a.day - b.day || (a.id < b.id ? -1 : 1));
    c.stars = ss;
    ss.forEach((s) => { s.con = c; });
    if (!c.status) c.status = ss.length >= 3 ? (c.polarity === 'pos' ? '유지' : '열림') : '씨앗';
    c.seed = c.status === '씨앗';
    c.first_date = c.first_date || (ss[0] && ss[0].date);
    c.last_date = c.last_date || (ss[ss.length - 1] && ss[ss.length - 1].date);
    c.lastDay = ss.length ? ss[ss.length - 1].day : dayNum(c.last_date);
    if (c.recent_4w == null) c.recent_4w = ss.filter((s) => s.day > day1 - 28).length;
    if (!c.monthly) { c.monthly = {}; ss.forEach((s) => { const k = s.date.slice(0, 7); c.monthly[k] = (c.monthly[k] || 0) + 1; }); }
    if (!c.channels) { c.channels = {}; ss.forEach((s) => { c.channels[s.channel] = (c.channels[s.channel] || 0) + 1; }); }
    c.branch = c.branch || (ss[0] && ss[0].branch) || branches[0];
  });
  stars.forEach((s) => { if (!s.con && s.constellation_id && conById.has(s.constellation_id)) s.con = conById.get(s.constellation_id); });

  const reviews = raw.reviews || {};
  const starsByReview = new Map();
  stars.forEach((s) => { if (!s.review_id) return; if (!starsByReview.has(s.review_id)) starsByReview.set(s.review_id, []); starsByReview.get(s.review_id).push(s); });

  // 월 목록(기간 안의 달)
  const months = [];
  { const a = new Date(day0 * 864e5), b = new Date(day1 * 864e5); let y = a.getUTCFullYear(), m = a.getUTCMonth();
    while (y < b.getUTCFullYear() || (y === b.getUTCFullYear() && m <= b.getUTCMonth())) { months.push(`${y}-${String(m + 1).padStart(2, '0')}`); m++; if (m > 11) { m = 0; y++; } } }

  return {
    meta, branches, asOf, from, day0, day1, months, gals, galById, stars, starById, cons, conById, reviews, starsByReview,
    ns: raw.north_star || null, core: raw.core || null, guard: raw.guardrails || null,
    sample: !!(meta.sample || meta.is_sample),
  };
}

// 우선순위(확정 결정 12: 최근 4주 별 수, 같으면 최근 순)

// ── 캔버스 텍스처 ──
function canvasTex(size, draw) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c); t.needsUpdate = true; return t;
}
function radial(stops) {
  return canvasTex(128, (g, s) => { const r = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2); stops.forEach(([o, a]) => r.addColorStop(o, `rgba(255,255,255,${a})`)); g.fillStyle = r; g.fillRect(0, 0, s, s); });
}
const TEX = {
  glow: radial([[0, 1], [0.12, 0.62], [0.32, 0.17], [0.62, 0.04], [1, 0]]),
  soft: radial([[0, 0.55], [0.45, 0.17], [1, 0]]),

};
const NEB_CACHE = [];
function nebulaTex(seed) {
  if (NEB_CACHE[seed]) return NEB_CACHE[seed];
  const size = LOW ? 112 : 160, r = rngOf('neb' + seed), N = 32, grid = new Float32Array(N * N);
  for (let i = 0; i < grid.length; i++) grid[i] = r();
  const vn = (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const X0 = ((xi % N) + N) % N, Y0 = ((yi % N) + N) % N, X1 = (X0 + 1) % N, Y1 = (Y0 + 1) % N;
    const a = grid[Y0 * N + X0], b = grid[Y0 * N + X1], c = grid[Y1 * N + X0], d = grid[Y1 * N + X1];
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);

  const g = cv.getContext('2d'), img = g.createImageData(size, size);
  const ox = r() * N, oy = r() * N, warp = 0.9 + r() * 0.8;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const nx = x / size, ny = y / size;
    const wx = vn(nx * 2 + ox + 5.2, ny * 2 + oy) * warp, wy = vn(nx * 2 + ox, ny * 2 + oy + 1.7) * warp;
    let f = 0, amp = 0.5, fr = 2.6;
    for (let o = 0; o < 5; o++) { f += amp * vn((nx + wx * 0.35) * fr + ox, (ny + wy * 0.35) * fr + oy); fr *= 2.03; amp *= 0.5; }
    const dx = nx - 0.5, dy = ny - 0.5, d = Math.sqrt(dx * dx + dy * dy) * 2;
    const fall = Math.max(0, 1 - d * d);
    const a = Math.pow(clamp((f - 0.3) * 1.9, 0, 1), 1.5) * fall;
    const i = (y * size + x) * 4; img.data[i] = img.data[i + 1] = img.data[i + 2] = 255; img.data[i + 3] = a * 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(cv); t.needsUpdate = true;
  NEB_CACHE[seed] = t; return t;
}

function sprite(map, color, opacity, size, additive = true) {

// 은하 그림(부드러운 팔의 빛). 입자 아래 깔아 은하다운 결을 만든다
function galaxyTexture(G, size, tint, tintAmt) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const g = cv.getContext('2d'), L = G.lay, R = G.R, c = size / 2, k = (size * 0.47) / (R * 1.12), r = rngOf('gt' + G.id + size);
  const blob = (x, y, rad, rgb, a) => { const gr = g.createRadialGradient(x, y, 0, x, y, rad); gr.addColorStop(0, `rgba(${rgb},${a})`); gr.addColorStop(1, `rgba(${rgb},0)`); g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2); };
  g.globalCompositeOperation = 'lighter';

  const tr = Math.round(tint.r * 255), tg = Math.round(tint.g * 255), tb = Math.round(tint.b * 255);
  for (let bi = 0; bi < 2; bi++) {

      const t = i / 300, rr = L.rc * 0.5 + t * (R * 1.04 - L.rc * 0.5);
      const th = L.armTheta(bi, rr) + gauss(r) * (0.07 + 0.1 * t);
      const x = c + Math.cos(th) * rr * k, y = c + Math.sin(th) * rr * k;
      const w = (0.05 + 0.09 * t) * R * k;
      const m = Math.min(1, t * 1.3);

      if (r() < tintAmt * 0.5) { cr = cr * 0.4 + tr * 0.6; cg = cg * 0.4 + tg * 0.6; cb = cb * 0.4 + tb * 0.6; }
      blob(x, y, w, `${cr | 0},${cg | 0},${cb | 0}`, 0.07 * (1 - 0.45 * t));
      if (r() < 0.035 && t > 0.25) blob(x + gauss(r) * w * 0.3, y + gauss(r) * w * 0.3, w * 0.22, '255,120,170', 0.35);
    }
  }
  blob(c, c, L.rc * 1.7 * k, '255,226,180', 0.5);
  blob(c, c, L.rc * 0.6 * k, '255,244,225', 0.6);
  // 먼지띠: 팔 안쪽 가장자리를 어둡게
  g.globalCompositeOperation = 'destination-out';
  for (let bi = 0; bi < 2; bi++) for (let i = 0; i < 220; i++) {

  const img = g.getImageData(0, 0, size, size), dd = img.data;
  for (let i = 0; i < dd.length; i += 4) { if (dd[i + 3] === 0) continue; const n = (r() - 0.5) * 6; dd[i] = clamp(dd[i] + n, 0, 255); dd[i + 1] = clamp(dd[i + 1] + n, 0, 255); dd[i + 2] = clamp(dd[i + 2] + n, 0, 255); dd[i + 3] = clamp(dd[i + 3] + (r() - 0.5) * 4, 0, 255); }
  g.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.needsUpdate = true;
  return tex;
}
function galaxyPlane(G, size, opacity, tint, tintAmt) {

// ── 셰이더 ──
const ADD = { transparent: true, depthWrite: false, blending: THREE.CustomBlending, blendEquation: THREE.AddEquation, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor };
const PXS = 'float pxs(vec4 mv, float s){ return s * projectionMatrix[1][1] * uViewH * 0.5 / max(-mv.z, 0.0001); }';

// 데이터 별: 강조(크기·밝기·회절광)를 이전값→목표값으로 섞어 부드럽게 바꾼다
function starMaterial() {
  return new THREE.ShaderMaterial({
    uniforms: { uTime: U.uTime, uViewH: U.uViewH, uMaxPx: U.uMaxPx, uMix: { value: 1 }, uOpacity: { value: 1 }, uMinPx: { value: 2.4 }, uTw: { value: RM ? 0 : 1 }, uWave: { value: -1 } },
    vertexShader: `
      uniform float uTime, uViewH, uMaxPx, uMix, uOpacity, uMinPx, uTw, uWave;
      attribute float aSize; attribute vec3 aColor; attribute float aPhase; attribute float aR;
      attribute vec3 aE0; attribute vec3 aE1;
      varying vec3 vColor; varying float vAlpha; varying float vSpike;
      ${PXS}
      void main(){
        vec3 E = mix(aE0, aE1, uMix);
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        float tw = 1.0 + uTw * 0.2 * sin(uTime * (0.8 + fract(aPhase * 7.31) * 1.9) + aPhase * 6.2831);
        float wave = uWave < -0.5 ? 0.0 : exp(-pow((aR - uWave) * 6.0, 2.0));
        float s = pxs(mv, aSize * E.x) * (1.0 + 0.7 * wave);
        float a = E.y * uOpacity * tw * (1.0 + 1.6 * wave);
        if (s < uMinPx) { a *= mix(0.6, 1.0, s / uMinPx); s = uMinPx; }
        gl_PointSize = min(s, uMaxPx);
        vColor = aColor; vAlpha = a; vSpike = E.z + wave * 0.6;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      varying vec3 vColor; varying float vAlpha; varying float vSpike;
      void main(){
        vec2 p = gl_PointCoord * 2.0 - 1.0;
        float r2 = dot(p, p);
        if (r2 > 1.0) discard;
        float core = exp(-r2 * 30.0);
        float halo = exp(-r2 * 6.5) * 0.4 + exp(-r2 * 2.2) * 0.06;
        float sp = 0.0;
        if (vSpike > 0.001) {
          float ax = abs(p.x), ay = abs(p.y);
          sp = (exp(-ay * 40.0) * pow(1.0 - ax, 2.2) + exp(-ax * 40.0) * pow(1.0 - ay, 2.2)) * vSpike;
        }
        float i = core * 1.8 + halo + sp * 0.85;
        vec3 col = mix(vColor, vec3(1.0), clamp(core * 0.8, 0.0, 1.0));
        gl_FragColor = vec4(col * i * vAlpha, 1.0);
      }`,
    ...ADD,
  });
}

// 은하 원반 입자: uUnfold 0→1 이면 안쪽부터 바깥으로 나선이 풀리며 펼쳐진다

  const m = new THREE.ShaderMaterial({
    uniforms: { uTime: U.uTime, uViewH: U.uViewH, uMaxPx: { value: (dark ? 64 : 2.6) * PR }, uUnfold: { value: 1 }, uOpacity: { value: 1 }, uArmDim: { value: new THREE.Vector3(1, 1, 1) }, uMinPx: { value: 1.2 } },
    vertexShader: `
      uniform float uTime, uViewH, uMaxPx, uUnfold, uOpacity, uMinPx; uniform vec3 uArmDim;
      attribute float aSize; attribute vec3 aColor; attribute float aAlpha; attribute float aR; attribute float aArm;
      varying vec3 vColor; varying float vAlpha;
      ${PXS}
      void main(){
        float p = smoothstep(aR * 0.6, aR * 0.6 + 0.4, uUnfold);

        gl_FragColor = vec4(vColor, exp(-r2 * 2.6) * vAlpha); }` : `

      void main(){ vec2 p = gl_PointCoord * 2.0 - 1.0; float r2 = dot(p, p); if (r2 > 1.0) discard;

// 배경 별(화면 픽셀 크기 고정)
function skyMaterial(opacity = 1) {
  return new THREE.ShaderMaterial({
    uniforms: { uTime: U.uTime, uPR: { value: PR }, uOpacity: { value: opacity }, uTw: { value: RM ? 0 : 1 } },
    vertexShader: `uniform float uTime, uPR, uOpacity, uTw; attribute float aSize; attribute vec3 aColor; attribute float aPhase;
      varying vec3 vColor; varying float vAlpha;
      void main(){ vec4 mv = modelViewMatrix * vec4(position, 1.0);
        float tw = 1.0 + uTw * 0.3 * sin(uTime * (0.5 + fract(aPhase * 3.71) * 2.3) + aPhase * 6.2831);

    fragmentShader: `varying vec3 vColor; varying float vAlpha;
      void main(){ vec2 p = gl_PointCoord * 2.0 - 1.0; float r2 = dot(p, p); if (r2 > 1.0) discard;
        float a = (exp(-r2 * 10.0) + exp(-r2 * 2.6) * 0.14) * vAlpha; gl_FragColor = vec4(vColor * a, 1.0); }`,

// 북극성으로 오르는 빛 알갱이
function beadMaterial() {

    fragmentShader: `varying vec3 vColor; varying float vAlpha;
      void main(){ vec2 p = gl_PointCoord * 2.0 - 1.0; float r2 = dot(p, p); if (r2 > 1.0) discard;
        float i = exp(-r2 * 16.0) * 1.6 + exp(-r2 * 4.0) * 0.3; gl_FragColor = vec4(mix(vColor, vec3(1.0), exp(-r2 * 30.0) * 0.7) * i * vAlpha, 1.0); }`,
    ...ADD,
  });
}

// 북극성(화면을 향하는 판, 회절광 4+4갈래)
function polarisMaterial() {
  return new THREE.ShaderMaterial({
    uniforms: { uTime: U.uTime, uSize: { value: 120 }, uI: { value: 1 }, uPulse: { value: RM ? 0 : 1 } },
    vertexShader: `uniform float uSize; varying vec2 vUv;
      void main(){ vUv = position.xy; vec4 mv = modelViewMatrix * vec4(0.0, 0.0, 0.0, 1.0); mv.xy += position.xy * uSize; gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `uniform float uTime, uI, uPulse; varying vec2 vUv;
      void main(){
        vec2 p = vUv * 2.0; float r = length(p);
        float pulse = 1.0 + uPulse * 0.08 * sin(uTime * 1.45);
        float core = exp(-r * r * 5200.0) * 2.6 + exp(-r * r * 520.0) * 0.42;
        float halo = exp(-r * 16.0) * 0.2 + exp(-r * 4.5) * 0.025;
        float sx = exp(-abs(p.y) * 380.0) * exp(-abs(p.x) * 4.6);
        float sy = exp(-abs(p.x) * 380.0) * exp(-abs(p.y) * 4.6);
        vec2 q = vec2(p.x + p.y, p.y - p.x) * 0.70710678;
        float sd = (exp(-abs(q.y) * 600.0) * exp(-abs(q.x) * 12.0) + exp(-abs(q.x) * 600.0) * exp(-abs(q.y) * 12.0)) * 0.32;
        float ring = exp(-pow((r - 0.12) * 140.0, 2.0)) * 0.035;
        float I = (core + halo * pulse + (sx + sy) * 0.7 * pulse + sd + ring) * uI;
        vec3 col = mix(vec3(0.6, 0.78, 1.0), vec3(1.0), clamp(core * 0.9, 0.0, 1.0));
        gl_FragColor = vec4(col * I, 1.0);
      }`,
    ...ADD,
  });
}

// 굵은 선(픽셀 단위 두께)

// ── 20 sky: 여러 겹의 별밭, 은하수 띠, 먼 성운, 북극성을 축으로 도는 장노출 궤적 ──
const NS_POS = new V3(0, 122, 0);
const sky = { far: null, mw: null, mid: null, near: null, trails: null, nebulae: [] };

function starTemp(r) {
  // 별의 색온도: 대부분 푸른 흰색, 일부 노랑·주황
  const x = r();
  if (x < 0.62) return new THREE.Color().setRGB(0.78 + r() * 0.1, 0.85 + r() * 0.08, 1.0);
  if (x < 0.86) return new THREE.Color().setRGB(1.0, 0.95, 0.86);
  if (x < 0.96) return new THREE.Color().setRGB(1.0, 0.83, 0.62);
  return new THREE.Color().setRGB(1.0, 0.68, 0.5);
}
function pointsGeo(n, fill) {
  const pos = new Float32Array(n * 3), col = new Float32Array(n * 3), size = new Float32Array(n), ph = new Float32Array(n);
  for (let i = 0; i < n; i++) fill(i, pos, col, size, ph);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  g.setAttribute('aPhase', new THREE.BufferAttribute(ph, 1));
  return g;
}
const MW_N = new V3(0.5, -0.8, 0.33).normalize(); // 은하수 띠의 축(첫 화면을 비스듬히 가로지르게)

function buildSky() {
  const r = rngOf('sky');
  // 1) 먼 별(무한 원경, 카메라를 따라감)
  const nFar = LOW ? 4200 : 9000;
  const farG = pointsGeo(nFar, (i, pos, col, size, ph) => {
    const u = r() * 2 - 1, th = r() * Math.PI * 2, s = Math.sqrt(1 - u * u), R = 5200;
    pos[i * 3] = s * Math.cos(th) * R; pos[i * 3 + 1] = u * R; pos[i * 3 + 2] = s * Math.sin(th) * R;
    const m = Math.pow(r(), 3.2), c = starTemp(r), b = 0.25 + m * 1.6;
    col[i * 3] = c.r * b; col[i * 3 + 1] = c.g * b; col[i * 3 + 2] = c.b * b;
    size[i] = 0.7 + m * 2.4; ph[i] = r();
  });
  sky.far = new THREE.Points(farG, skyMaterial(1));
  sky.far.frustumCulled = false; sky.far.renderOrder = -10;
  scene.add(sky.far);

  // 2) 은하수 띠(원경): 가우스 폭, 경도 방향 밝기 변화, 먼지 틈
  const nMw = LOW ? 9000 : 24000;
  const e1 = new V3(1, 0, 0).cross(MW_N).normalize(), e2 = MW_N.clone().cross(e1).normalize();
  const vd = new V3(0, -0.38, -0.92).normalize(), lonC = Math.atan2(vd.dot(e2), vd.dot(e1)) + 0.35; // 밝은 부분을 화면 가운데 근처로
  const mwG = pointsGeo(nMw, (i, pos, col, size, ph) => {
    let lon = r() * Math.PI * 2;
    const dens = 0.45 + 0.35 * Math.sin(lon * 2 + 0.6) * Math.sin(lon * 3.1 + 1.3) + 0.45 * Math.max(0, Math.cos(lon - lonC));
    const lat = gauss(r) * (0.07 + 0.06 * dens) + Math.sin(lon * 5.0) * 0.025;
    const R = 5000, cl = Math.cos(lat);
    const v = e1.clone().multiplyScalar(Math.cos(lon) * cl).addScaledVector(e2, Math.sin(lon) * cl).addScaledVector(MW_N, Math.sin(lat));
    pos[i * 3] = v.x * R; pos[i * 3 + 1] = v.y * R; pos[i * 3 + 2] = v.z * R;
    const warm = Math.max(0, Math.cos(lon - lonC)) * 0.7;
    const rift = Math.exp(-Math.pow(lat / 0.018, 2)) * (0.5 + 0.5 * Math.sin(lon * 7.0));
    const b = (0.2 + Math.pow(r(), 4) * 1.25) * (0.55 + dens * 0.75) * (1 - rift * 0.78);
    col[i * 3] = (0.72 + warm * 0.3) * b; col[i * 3 + 1] = (0.78 + warm * 0.12) * b; col[i * 3 + 2] = (1.0 - warm * 0.25) * b;
    size[i] = 0.7 + r() * 1.3; ph[i] = r();
  });
  sky.mw = new THREE.Points(mwG, skyMaterial(1));
  sky.mw.frustumCulled = false; sky.mw.renderOrder = -9;
  scene.add(sky.mw);
  // 은하수 빛 구름
  sky.mwGlow = new THREE.Group(); sky.mwGlow.renderOrder = -8;
  const nG = LOW ? 16 : 30;
  for (let i = 0; i < nG; i++) {
    const lon = r() * Math.PI * 2, lat = gauss(r) * 0.05;
    const cl = Math.cos(lat), R = 4800;
    const v = e1.clone().multiplyScalar(Math.cos(lon) * cl).addScaledVector(e2, Math.sin(lon) * cl).addScaledVector(MW_N, Math.sin(lat));
    const warm = Math.max(0, Math.cos(lon - lonC));
    const c = new THREE.Color().setRGB(0.55 + warm * 0.3, 0.58 + warm * 0.04, 1.0 - warm * 0.12);
    const s = sprite(nebulaTex(i % 5), c, (0.03 + r() * 0.035) * (0.6 + 0.6 * warm), 700 + r() * 900);
    s.position.copy(v.multiplyScalar(R)); s.material.rotation = r() * 6.28;

  }
  scene.add(sky.mwGlow);

  // 3) 먼 성운(색 있는 가스, 아주 옅게)
  const nebs = [[new V3(-0.75, 0.32, -0.58), '#7d5cff', 0.1, 1700], [new V3(0.86, -0.12, -0.5), '#ff6f9c', 0.035, 1500], [new V3(0.1, -0.55, 0.83), '#3fa3ff', 0.07, 2000], [new V3(-0.4, -0.2, 0.9), '#9a7bff', 0.05, 1600], [new V3(0.6, 0.5, 0.62), '#ffb38a', 0.045, 1400]];
  nebs.forEach(([d, c, o, s], i) => {
    const sp = sprite(nebulaTex(10 + i), new THREE.Color(c), o, s);
    sp.position.copy(d.normalize().multiplyScalar(4300)); sp.material.rotation = i * 1.3;
    sky.nebulae.push(sp); sky.mwGlow.add(sp);
  });

  // 4) 중간 별(시차가 생기는 층)
  const nMid = LOW ? 1000 : 2400;
  const midG = pointsGeo(nMid, (i, pos, col, size, ph) => {
    const u = r() * 2 - 1, th = r() * Math.PI * 2, s = Math.sqrt(1 - u * u), R = 900 + r() * 1800;
    pos[i * 3] = s * Math.cos(th) * R; pos[i * 3 + 1] = u * R + 60; pos[i * 3 + 2] = s * Math.sin(th) * R;
    const m = Math.pow(r(), 2.6), c = starTemp(r), b = 0.3 + m * 1.4;
    col[i * 3] = c.r * b; col[i * 3 + 1] = c.g * b; col[i * 3 + 2] = c.b * b;
    size[i] = 0.9 + m * 2.2; ph[i] = r();
  });
  sky.mid = new THREE.Points(midG, skyMaterial(1));
  sky.mid.frustumCulled = false;
  scene.add(sky.mid);

  // 5) 가까운 먼지 별(날아갈 때 스쳐 지나감)
  const nNear = LOW ? 500 : 1300;
  const nearG = pointsGeo(nNear, (i, pos, col, size, ph) => {
    const u = r() * 2 - 1, th = r() * Math.PI * 2, s = Math.sqrt(1 - u * u), R = 40 + Math.pow(r(), 0.7) * 520;
    pos[i * 3] = s * Math.cos(th) * R; pos[i * 3 + 1] = u * R * 0.6 + 40; pos[i * 3 + 2] = s * Math.sin(th) * R;
    const b = 0.26 + r() * 0.42;
    col[i * 3] = 0.75 * b; col[i * 3 + 1] = 0.82 * b; col[i * 3 + 2] = 1.0 * b;
    size[i] = 0.8 + r() * 1.3; ph[i] = r();
  });
  sky.near = new THREE.Points(nearG, skyMaterial(1));
  sky.near.frustumCulled = false;
  scene.add(sky.near);

  // 6) 장노출 별 궤적: 북극성을 중심으로 한 동심 호(첫 화면에서 북극성을 둘러싸게)
  const nT = LOW ? 60 : 130, segs = 48;
  const tp = [], tc = [];
  for (let i = 0; i < nT; i++) {
    const rr = 70 + Math.pow(r(), 0.75) * 1400, yy = (r() - 0.5) * 40;
    const a0 = r() * Math.PI * 2, len = 0.16 + r() * 0.6;
    const c = starTemp(r), b = 0.05 + Math.pow(r(), 2.2) * 0.26;
    for (let k = 0; k < segs; k++) {
      const a1 = a0 + (len * k) / segs, a2 = a0 + (len * (k + 1)) / segs;
      const f1 = Math.pow(k / segs, 1.8) * b, f2 = Math.pow((k + 1) / segs, 1.8) * b;
      tp.push(Math.cos(a1) * rr, yy, Math.sin(a1) * rr, Math.cos(a2) * rr, yy, Math.sin(a2) * rr);
      tc.push(c.r * f1, c.g * f1, c.b * f1, c.r * f2, c.g * f2, c.b * f2);
    }
  }
  const tg = new THREE.BufferGeometry();
  tg.setAttribute('position', new THREE.Float32BufferAttribute(tp, 3));
  tg.setAttribute('color', new THREE.Float32BufferAttribute(tc, 3));
  sky.trails = new THREE.LineSegments(tg, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.9, depthWrite: false, blending: THREE.AdditiveBlending }));
  sky.trails.frustumCulled = false;
  sky.trailsPivot = new THREE.Group();
  sky.trailsPivot.position.copy(NS_POS);
  sky.trailsPivot.add(sky.trails);
  scene.add(sky.trailsPivot);
}
// 궤적 축을 첫 화면 카메라 쪽으로(북극성을 중심으로 동심원처럼 보이게)
function aimTrails(camPos) {

  sky.trailsPivot.quaternion.setFromUnitVectors(new V3(0, 1, 0), dir);
}

const _sq = new THREE.Quaternion(), _sd = new V3(), _sy = new V3(0, 1, 0);
function updateSky(dt, spinK) {
  _sd.copy(camera.position).sub(NS_POS).normalize();
  _sq.setFromUnitVectors(_sy, _sd);
  sky.trailsPivot.quaternion.slerp(_sq, 1 - Math.exp(-dt * 1.2));
  sky.trails.material.opacity += ((S.level === 0 ? 0.9 : 0.0) - sky.trails.material.opacity) * (1 - Math.exp(-dt * 3));
  sky.trails.visible = sky.trails.material.opacity > 0.004;
  // 원경은 카메라를 따라가 무한히 먼 것처럼
  sky.far.position.copy(camera.position);
  sky.mw.position.copy(camera.position);
  sky.mwGlow.position.copy(camera.position);
  if (!RM) sky.trails.rotation.y += dt * (Math.PI * 2 / 900) * (0.35 + 0.65 * spinK);
}

// ── 30 universe: 북극성, 기준 원, 은하 9개(원반과 데이터 별 배치), 북극성을 향한 선 ──
const RING_R = 106;
const universe = new THREE.Group();
const GAL = [];
const GAL_BY_ID = new Map();
let M = null;                      // 데이터 모델
const branchOn = (b) => S.branch === '전체' || S.branch === b;
const bIdx = (b) => Math.max(0, M.branches.indexOf(b));
const NS = { mesh: null, glow: null, axis: null };
const PTR = { group: new THREE.Group(), gold: null, vio: null, brk: null, beads: null, marks: null, op: 1 };

function buildUniverse() {
  scene.add(universe);

  {

    NS.axis = new THREE.Line(g, new THREE.LineDashedMaterial({ color: COL.polar, dashSize: 1.6, gapSize: 3.2, transparent: true, opacity: 0.2, depthWrite: false, blending: THREE.AdditiveBlending }));
    NS.axis.computeLineDistances(); scene.add(NS.axis);

  const ringMat = (op, dash) => new THREE.LineDashedMaterial({ color: COL.gold, dashSize: dash, gapSize: dash * 1.6, transparent: true, opacity: op, depthWrite: false, blending: THREE.AdditiveBlending });
  [[RING_R, 0.2, 2.2], [RING_R * 0.5, 0.07, 1.4], [RING_R * 1.32, 0.05, 3]].forEach(([rr, op, dash]) => {
    const pts = []; for (let i = 0; i <= 256; i++) { const a = (i / 256) * Math.PI * 2; pts.push(new V3(Math.cos(a) * rr, 0, Math.sin(a) * rr)); }
    const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), ringMat(op, dash)); l.computeLineDistances(); l.userData.op = op;
    universe.add(l); (universe.userData.rings = universe.userData.rings || []).push(l);
  });

  const maxStars = Math.max(1, ...M.gals.map((g) => M.stars.filter((s) => s.galaxy === g.id).length));
  M.gals.forEach((g, i) => { const G = makeGalaxy(g, i, M.gals.length, maxStars); GAL.push(G); GAL_BY_ID.set(G.id, G); });
  universe.add(PTR.group);

}

// 은하 원반이 관찰자 쪽(위·앞)으로 살짝 고개를 든다. 우주가 돌아도 매 프레임 같은 방향을 본다.
const FACE_PT = new V3(0, 420, 640), _gq = new THREE.Quaternion(), _gq2 = new THREE.Quaternion(), _gn = new V3(), _gw = new V3(), _gy = new V3(0, 1, 0);
function orientGalaxies() {
  universe.updateMatrixWorld();
  universe.getWorldQuaternion(_gq2).invert();
  GAL.forEach((G) => {
    G.group.getWorldPosition(_gw);
    _gn.copy(FACE_PT).sub(_gw).normalize().multiplyScalar(0.62);
    _gn.y += 0.38; _gn.normalize();
    _gq.setFromUnitVectors(_gy, _gn);
    G.group.quaternion.copy(_gq2).multiply(_gq);
  });
}

// ── 은하 하나 ──
function makeGalaxy(g, i, n, maxStars) {
  const r = rngOf('gal' + g.id);
  const stars = M.stars.filter((s) => s.galaxy === g.id);
  const cons = M.cons.filter((c) => c.galaxy === g.id);
  const R = 10 + 12 * Math.sqrt(stars.length / maxStars);
  const a = -Math.PI / 2 + (i * Math.PI * 2) / n;
  const group = new THREE.Group();
  group.position.set(Math.cos(a) * RING_R, (r() - 0.5) * 16, Math.sin(a) * RING_R);
  universe.add(group);
  const inner = new THREE.Group(); inner.rotation.y = r() * Math.PI * 2; group.add(inner);
  const G = { id: g.id, g, idx: i, R, angle: a, group, inner, stars, cons, unfold: 0, unf: { from: 0, to: 0, t0: 0, dur: 1 }, wave: { t0: -1 }, detail: null, figs: null, op: 1 };
  G.lay = makeLayout(G);
  layoutStars(G);
  G.tint = new THREE.Color();
  G.base = new THREE.Points(genDisk(G, Math.round((LOW ? 1400 : 3000) * (0.55 + 0.45 * R / 22)), false), diskMaterial(false));
  G.base.renderOrder = 1; inner.add(G.base);
  G.core = sprite(TEX.glow, new THREE.Color('#ffe0b0'), 0.75, R * 0.42); G.core.renderOrder = 2; inner.add(G.core);
  G.haze = sprite(TEX.soft, new THREE.Color('#8fa4ff'), 0.2, R * 2.5); G.haze.renderOrder = 0; inner.add(G.haze);
  buildDataStars(G);
  updateTint(G);
  G.plane = galaxyPlane(G, LOW ? 192 : 256, 0.75, G.tint, G.tintAmt); inner.add(G.plane);
  return G;
}

function makeLayout(G) {
  const R = G.R, rc = R * 0.17, rOut = R * 0.93;
  const span = Math.max(7, M.day1 - M.day0);
  const rOfDay = (d) => rc + (rOut - rc) * clamp((d - M.day0) / span, -0.02, 1.02);
  const k = 4.4 / Math.log(rOut / rc);
  const nb = Math.max(2, M.branches.length);
  const armTheta = (bi, rr) => (bi * Math.PI * 2) / nb + k * Math.log(Math.max(rr, rc * 0.45) / rc);
  return { R, rc, rOut, rOfDay, armTheta, k, span };
}

// 자리 배치에만 쓰는 날짜 흩뿌림(월 기준·수집일 기준 날짜가 한 원에 몰리지 않게). 카드에는 원래 날짜를 쓴다.
function layoutDay(s) {
  const r = rngOf('d' + s.id);
  if (s.date_source === 'month') return s.day + (r() - 0.5) * 24;
  if (s.date_source === 'collected') return s.day - r() * 6;
  return s.day + (r() - 0.5) * 0.8;
}

function layoutStars(G) {
  const L = G.lay, R = G.R;
  // 지점 팔마다 별자리 차선: 시간 구간이 겹치지 않으면 같은 차선을 함께 쓴다
  const byB = new Map();
  G.cons.forEach((c) => { const b = bIdx(c.branch); if (!byB.has(b)) byB.set(b, []); byB.get(b).push(c); });
  const seq = []; for (let i = 0; i < 40; i++) seq.push(i + 0.5, -(i + 0.5));
  for (const [b, list] of byB) {
    list.sort((x, y) => (x.seed - y.seed) || (y.stars.length - x.stars.length) || conOrder(x, y));
    const lanes = [];
    list.forEach((c) => {
      const d0 = c.stars.length ? c.stars[0].day - 9 : 0, d1 = c.stars.length ? c.stars[c.stars.length - 1].day + 9 : 0;
      let li = 0;
      for (; li < lanes.length; li++) if (lanes[li].every(([p, q]) => d1 < p || d0 > q)) break;
      if (li === lanes.length) lanes.push([]);
      lanes[li].push([d0, d1]); c._lane = li;
    });
    const spacing = Math.min(0.24, 2.1 / Math.max(1, lanes.length + 0.5));
    list.forEach((c) => { c._off = seq[c._lane] * spacing; c._bi = b; });
  }
  // 별 위치(은하 안쪽 좌표). 반지름 = 시간, 팔 = 지점
  G.list = [];
  G.densK = clamp(Math.sqrt(260 / Math.max(1, G.stars.length)), 0.55, 1);
  const put = (s, kind, latPhys, radJit, yJit) => {

// ── 고르기(화면 좌표 → 무엇) ──
const _pv = new V3();

function pick(cx, cy, touch) {

    if (L.kind === 'gal' && cx >= L.rect.l && cx <= L.rect.r && cy >= L.rect.t && cy <= L.rect.b) return { type: 'gal', id: L.data.gid };
  }
  if (S.level === 0) {
    const ns = toScreen(NS_POS); if (ns.z < 1 && Math.hypot(ns.x - cx, ns.y - cy) < (touch ? 52 : 40)) return { type: 'ns' };
    let best = null, bd = 1e9;

      const w = G.group.getWorldPosition(new V3()), p = toScreen(w); if (p.z > 1) return;
      const rad = Math.max(touch ? 36 : 28, screenRadius(w, G.R) * 1.05), d = Math.hypot(p.x - cx, p.y - cy);
      if (d < rad && d < bd) { bd = d; best = { type: 'gal', id: G.id }; }

    const s = rec.s; if (!branchOn(s.branch)) continue;
    const c = s.con && s.con.galaxy === G.id ? s.con : null;
    const focus = S.level >= 2 && c && c.id === S.cid;
    _pv.copy(rec.pos).applyMatrix4(G.inner.matrixWorld);
    const p = toScreen(_pv); if (p.z > 1) continue;
    let d = Math.hypot(p.x - cx, p.y - cy);
    const lim = focus ? thrF : thr;
    if (d > lim) continue;
    if (focus) d -= 12;                   // 초점 별자리의 별을 먼저
    if (rec.kind === 'single') d += 4;

    const c = best.s.con && best.s.con.galaxy === G.id ? best.s.con : null;

    if (S.level === 1) return { type: 'con', id: c.id };

  const G = GAL_BY_ID.get(s.galaxy), c = s.con && s.con.galaxy === s.galaxy ? s.con : null;
  const dsTag = s.date_source === 'collected' ? '<span class="tag">수집일</span>' : s.date_source === 'month' ? '<span class="tag">월 기준</span>' : '';
  const dateTxt = s.date_source === 'month' ? `${s.date.slice(0, 4)}.${s.date.slice(5, 7)}` : fmtDate(s.date);
  const ko = rv.text_ko || '', orig = rv.text_orig || '';
  const hasOrig = orig && orig.trim() && orig.trim() !== ko.trim();
  const showOrig = S.tab === 'orig' && hasOrig;
  const body = showOrig ? esc(orig) : markQuote(ko, s.quote);
  const pc = s.polarity === 'pos' ? 'c-pos' : 'c-neg';
  const sib = (M.starsByReview.get(s.review_id) || []).filter((x) => x.id !== s.id);
  const sibRows = sib.map((x) => `<button type="button" class="row" data-star="${esc(x.id)}"><span class="dot ${polClass(x.polarity)}"></span><span class="nm">${esc(x.phenomenon || '')}<small>${esc(x.galaxy)} · ${x.con ? esc(x.con.status) : '단발'}</small></span><span class="st ${polClass(x.polarity)}">${x.polarity === 'pos' ? '칭찬' : '불편'}</span><span class="n"></span></button>`).join('');
  return `<div><div class="eyebrow">${esc(s.branch)} · ${esc(chName(s.channel))} · <span class="num">${dateTxt}</span>${dsTag}</div>
      <div class="score"><b class="num">${rv.rating != null ? fmtScore(rv.rating, rv.scale) : '—'}</b><span class="num">/ ${rv.scale || 10}</span></div></div>
    <div class="voice ${pc}" style="--mk:${s.polarity === 'pos' ? 'rgba(255,210,124,.22)' : 'rgba(255,114,98,.22)'}">
      <div class="vk">${s.polarity === 'pos' ? '칭찬' : '불편'} · ${esc(G ? G.g.name : s.galaxy)} · ${esc(c ? c.name : s.phenomenon || '')}${c ? '' : ' · 단발'}</div>
      <blockquote>${esc(s.quote || '')}</blockquote>
      ${s.relation_signal ? `<div class="sig">CR 신호 · ${esc(sigName(s.relation_signal))}</div>` : ''}
    </div>
    <div class="rev">
      <div class="sect-k"><span class="t">리뷰 전문</span>${hasOrig ? '' : '<span>원문 한국어</span>'}</div>
      ${hasOrig ? `<div class="rev-tabs" role="group" aria-label="언어"><button type="button" data-tab="ko" aria-pressed="${!showOrig}">번역</button><button type="button" data-tab="orig" aria-pressed="${showOrig}">원문</button></div>` : ''}
      <p class="prose" style="--mk:${s.polarity === 'pos' ? 'rgba(255,210,124,.24)' : 'rgba(255,114,98,.24)'}">${body || '<span class="foot-k">본문 없음</span>'}</p>
    </div>
    ${sib.length ? `<div><div class="sect-k"><span class="t">같은 리뷰의 다른 별<b class="num">${sib.length}</b></span></div><div class="rows">${sibRows}</div></div>` : ''}`;
}

function updateReviewTab() {
  const s = M.starById.get(S.sid); if (!s) return;
  const rv = M.reviews[s.review_id] || {}, ko = rv.text_ko || '', orig = rv.text_orig || '';
  const showOrig = S.tab === 'orig' && orig.trim() && orig.trim() !== ko.trim();
  const pr = document.querySelector('#p-body .prose');
  if (pr) pr.innerHTML = (showOrig ? esc(orig) : markQuote(ko, s.quote)) || '<span class="foot-k">본문 없음</span>';
  document.querySelectorAll('#p-body [data-tab]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.tab === (showOrig ? 'orig' : 'ko') ? 'true' : 'false'));
  PANEL_KEY = 's:' + S.sid + ':' + S.tab;
}
function syncRowHighlight() {
  const id = S.hover && S.hover.type === 'star' ? S.hover.id : null;
  document.querySelectorAll('#p-body .row.star, #p-body .row[data-star]').forEach((el) => {
    el.classList.toggle('hl', el.dataset.star === id);
    el.classList.toggle('on', el.dataset.star === S.sid);
  });
}

// ── 휴대폰 시트 ──
let SHEET = 'half';
function defaultSheet() { return S.level === 1 ? 'peek' : 'half'; }
function sheetTargetPx() {
  if (SHEET === 'peek') return Math.min(196, H * 0.3);
  if (SHEET === 'full') return H - 128;
  return H * (S.level === 3 ? 0.56 : 0.5);
}
function setSheet(st, silent) {
  SHEET = st;
  const p = $('panel');
  p.style.setProperty('--sheet-h', `${Math.round(sheetTargetPx(S.level))}px`);
  if (!silent) { const off = targetOffsets(S.level); VIEW.tox = off.ox; VIEW.toy = off.oy; }
}
function bindSheet() {
  const grab = $('grab'), p = $('panel');
  let sy = 0, sh = 0, dragging = false, hist = [];
  grab.addEventListener('pointerdown', (e) => { if (!isPhone()) return; dragging = true; sy = e.clientY; sh = p.getBoundingClientRect().height; hist = [{ y: e.clientY, t: performance.now() }]; grab.setPointerCapture(e.pointerId); p.classList.add('dragging'); });
  grab.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const h = clamp(sh + (sy - e.clientY), 90, H - 110);
    p.style.setProperty('--sheet-h', `${h}px`); VIEW.toy = Math.round((hudBottom() + 8 + (H - h)) / 2 - H / 2);
    hist.push({ y: e.clientY, t: performance.now() }); if (hist.length > 6) hist.shift();
  });
  const end = (e) => {
    if (!dragging) return; dragging = false; p.classList.remove('dragging');
    const a = hist[0], b = hist[hist.length - 1], v = (a.y - b.y) / Math.max(16, b.t - a.t) * 1000; // 위로 +
    const cur = p.getBoundingClientRect().height + (v / 1000) * 0.998 / (1 - 0.998) * 0.12;
    const opts = [['peek', Math.min(196, H * 0.3)], ['half', H * 0.5], ['full', H - 128]];
    let best = opts[0]; opts.forEach((o) => { if (Math.abs(o[1] - cur) < Math.abs(best[1] - cur)) best = o; });
    setSheet(best[0]);
  };
  grab.addEventListener('pointerup', end); grab.addEventListener('pointercancel', end);
}

// ── 버튼과 키 ──
function moveSegInd() {
  const seg = $('seg'), ind = seg.querySelector('.seg-ind'), on = seg.querySelector('[aria-checked="true"]');
  if (!on) return;
  ind.style.width = `${on.offsetWidth}px`;
  ind.style.transform = `translateX(${on.offsetLeft}px)`;
}
function bindUI() {
  $('crumbs').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-nav]'); if (!b) return;
    const k = b.dataset.nav;
    if (k === 'up') nav.up(); else if (k === 'home') nav.universe(); else if (k === 'gal') nav.galaxy(S.gid); else if (k === 'con') nav.con(S.cid);
    else if (k === 'panel') { S.panelHidden = false; renderUI(); }
  });
  $('seg').addEventListener('click', (e) => { const b = e.target.closest('button[data-br]'); if (b && b.dataset.br !== S.branch) setBranch(b.dataset.br); });
  $('seg').addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const bs = [...$('seg').querySelectorAll('button')], i = bs.findIndex((x) => x.dataset.br === S.branch);
    const n = bs[(i + (e.key === 'ArrowRight' ? 1 : bs.length - 1)) % bs.length]; setBranch(n.dataset.br); n.focus(); e.preventDefault();
  });
  $('btn-spin').addEventListener('click', () => { S.spin = !S.spin; $('btn-spin').setAttribute('aria-pressed', S.spin ? 'true' : 'false'); });
  $('btn-home').addEventListener('click', () => nav.universe({ reset: true }));
  $('p-close').addEventListener('click', () => {
    if (S.ns) { nav.universe(); return; }
    S.panelHidden = true; renderUI();
  });
  const body = $('p-body');
  body.addEventListener('click', (e) => {
    const t = e.target.closest('[data-tab]'); if (t) { S.tab = t.dataset.tab; updateReviewTab(); return; }
    const c = e.target.closest('[data-con]'); if (c) { nav.con(c.dataset.con); return; }
    const s = e.target.closest('[data-star]'); if (s) { nav.star(s.dataset.star); }
  });
  body.addEventListener('pointerover', (e) => {
    if (e.pointerType !== 'mouse') return;
    const s = e.target.closest('[data-star]'), c = e.target.closest('[data-con]');
    if (s) { const st = M.starById.get(s.dataset.star); if (st && st.galaxy === S.gid) setHover({ type: 'star', id: s.dataset.star }); }
    else if (c) { const cc = M.conById.get(c.dataset.con); if (cc && cc.galaxy === S.gid) setHover({ type: 'con', id: c.dataset.con }); }
  });
  body.addEventListener('pointerleave', () => setHover(null));
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.preventDefault(); nav.up(); }
  });
  // 키보드·화면 낭독용 은하 목록
  $('gal-index').innerHTML = GAL.map((G) => `<button type="button" data-gal="${esc(G.id)}">${esc(G.g.name)}</button>`).join('') + '<button type="button" data-ns="1">북극성</button>';
  $('gal-index').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.ns) nav.northStar(); else nav.galaxy(b.dataset.gal); });
  bindSheet();
}

// ── 90 main: 시작, 매 프레임, 크기 변경 ─────────────────────────────────────
const UNI = { k: RM ? 0 : 1 };
const RAW = (() => { try { return JSON.parse($('voc-data').textContent); } catch (e) { console.error('VOC 데이터를 읽지 못함', e); return null; } })();
let lastMs = CLOCK.t, frames = 0, firstDone = false;
const PERF = { n: 0, sum: 0, checked: false, t0: 0 };

function bootMessage(t) { const m = $('boot-msg'); m.hidden = false; m.textContent = t; }

function init() {
  if (!RAW) { bootMessage('데이터를 읽지 못했습니다.'); return; }
  M = buildModel(RAW);
  if (M.sample) $('sample-tag').hidden = false;
  if (!GL_OK) { bootMessage('이 브라우저에서는 3D 화면을 켤 수 없습니다.'); return; }
  if (H > W * 1.15) { NS_POS.y = 205; FACE_PT.set(0, 640, 420); }
  buildSky();
  buildUniverse();
  buildUniverseLabels();
  bindUI();
  bindInput();
  glWrap.classList.add('grab');
  const g0 = homeGoal(Math.PI / 2);
  rig.target.copy(g0.target); rig.r = g0.r; rig.phi = g0.phi; rig.theta = g0.theta; rig.q.identity(); rig.upq.identity();
  orientGalaxies();
  renderUI(); moveSegInd(); setLimits();
  VIEW.ox = VIEW.tox; VIEW.oy = VIEW.toy; setViewOffset(camera, VIEW.ox, VIEW.oy);
  { const g1 = homeGoal(Math.PI / 2); rig.r = g1.r; }
  applyRig(); applyEmphasisAll();
  aimTrails(camera.position);
  window.addEventListener('resize', onResize);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measureLabels(); moveSegInd(); });
  requestAnimationFrame(loop);
  exposeHooks();
}

function updateGalaxies(dt, t) {
  const k = 1 - Math.exp(-dt * 5);
  GAL.forEach((G) => {
    const f = G.unf;
    G.unfold = t < f.t0 ? f.from : lerp(f.from, f.to, easeIO(clamp((t - f.t0) / Math.max(0.001, f.dur), 0, 1)));
    if (G.wave.t0 > 0) {
      const w = (t - G.wave.t0) / G.wave.dur;
      if (w < 0) G.waveVal = -0.08; else if (w <= 1) G.waveVal = -0.05 + 1.22 * w; else { G.waveVal = -1; G.wave.t0 = -1; }
    } else G.waveVal = -1;
    G.dots.material.uniforms.uWave.value = G.waveVal >= 0 ? G.waveVal : -1;
    const inG = S.level >= 1 && S.gid === G.id;
    const hot = S.level === 0 && S.hover && S.hover.type === 'gal' && S.hover.id === G.id;
    const opT = S.level === 0 ? 1 : inG ? 1 : 0.16;
    G.op += (opT - G.op) * k;
    G.hotK = (G.hotK || 0) + ((hot ? 1 : 0) - (G.hotK || 0)) * (1 - Math.exp(-dt * 10));
    G.base.material.uniforms.uOpacity.value = G.op * (inG ? lerp(1, 0, G.unfold) : 1) * (1 + 0.35 * G.hotK);
    G.plane.material.opacity = G.plane.userData.op * G.op * (inG ? lerp(1, 0, G.unfold) : 1) * (1 + 0.3 * G.hotK);
    G.plane.visible = G.plane.material.opacity > 0.003;
    G.dots.material.uniforms.uOpacity.value = G.op;
    G.core.material.opacity = 0.75 * G.op * (inG ? lerp(1, 0.22, G.unfold) : 1);
    G.haze.material.opacity = G.haze.userData.op * G.op * (1 + 1.1 * G.hotK) * (inG ? lerp(1, 0.15, G.unfold) : 1);
    G.focusK = inG ? 1 : Math.max(0, (G.focusK || 0) - dt * 2);
    const em = clamp((t - G.emix.t0) / G.emix.dur, 0, 1);
    G.dots.material.uniforms.uMix.value = easeOut(em);
    updateDetail(G, dt);
  });
}

function loop() {
  const ms = tick();
  const dt = Math.min(0.1, Math.max(0, (ms - lastMs) / 1000)); lastMs = ms;
  const t = ms / 1000;
  U.uTime.value = t;
  if (finishPass) finishPass.uniforms.uTime.value = t;
  const spinT = S.spin && !RM ? 1 : 0;
  SPIN.k += (spinT - SPIN.k) * (1 - Math.exp(-dt * 2));
  const uniT = spinT && S.level === 0 && !S.ns && !P.drag ? 1 : 0;
  UNI.k += (uniT - UNI.k) * (1 - Math.exp(-dt * (uniT ? 1.2 : 6)));
  if (!RM) {
    universe.rotation.y += dt * ((Math.PI * 2) / 560) * UNI.k;
    GAL.forEach((G) => { G.inner.rotation.y += dt * 0.03 * UNI.k; });
  }
  if (UNI.k > 0.0005) orientGalaxies();
  processHover();
  updateViewOffset(dt);
  updateRig(dt, ms);
  updateSky(dt, SPIN.k);
  updateGalaxies(dt, t);
  // 우주 단계 요소(북극성을 향한 선, 기준 원)
  const l0 = S.level === 0 ? 1 : 0;
  setPointerOpacity(PTR.op + (lerp(0, 1, l0) - PTR.op) * (1 - Math.exp(-dt * 4)));
  (universe.userData.rings || []).forEach((l) => { l.material.opacity += (l.userData.op * lerp(0.0, 1, l0) - l.material.opacity) * (1 - Math.exp(-dt * 4)); l.visible = l.material.opacity > 0.003; });
  NS.axis.material.opacity += (lerp(0, 0.2, l0) - NS.axis.material.opacity) * (1 - Math.exp(-dt * 4)); NS.axis.visible = NS.axis.material.opacity > 0.003;
  const nsHot = S.hover && S.hover.type === 'ns' ? 1 : 0;
  NS.mesh.material.uniforms.uI.value += ((S.ns ? 1.25 : 1) * (1 + 0.25 * nsHot) - NS.mesh.material.uniforms.uI.value) * (1 - Math.exp(-dt * 6));
  { const Gc = S.level >= 1 ? GAL_BY_ID.get(S.gid) : null; const bt = Gc ? 0.74 * lerp(0.62, 1, (Gc.densK - 0.55) / 0.45) : 0.74; bloom.strength += (bt - bloom.strength) * (1 - Math.exp(-dt * 3)); }
  applyLabels(t);
  composer.render(dt);
  updateLabels(ms);
  if (!firstDone) {
    firstDone = true;
    const s0 = $('sky0'); s0.classList.add('gone'); setTimeout(() => s0.remove(), 1300);
  }
  perfCheck(dt, t);
  requestAnimationFrame(loop);
}

// 느린 기기면 한 번 해상도를 낮춘다
function perfCheck(dt, t) {
  if (PERF.checked) return;
  if (!PERF.t0) PERF.t0 = t;
  if (t - PERF.t0 < 1.5) return;
  PERF.n++; PERF.sum += dt;
  if (PERF.n >= 90) {
    PERF.checked = true;
    if (PERF.sum / PERF.n > 0.034 && renderer.getPixelRatio() > 1) {
      renderer.setPixelRatio(1); composer.setPixelRatio(1); composer.setSize(W, H); U.uViewH.value = H;
      sky.far.material.uniforms.uPR.value = 1; sky.mw.material.uniforms.uPR.value = 1; sky.mid.material.uniforms.uPR.value = 1; sky.near.material.uniforms.uPR.value = 1;
    }
  }
}

function onResize() {
  W = Math.max(1, innerWidth); H = Math.max(1, innerHeight);
  renderer.setSize(W, H, false); composer.setSize(W, H);
  U.uViewH.value = H * renderer.getPixelRatio();
  finishPass.uniforms.uRes.value.set(W, H);
  LINE_MATS.forEach((m) => m.resolution.set(W, H));
  if (isPhone() && panelWanted()) setSheet(SHEET, true);
  const off = targetOffsets(S.level); VIEW.tox = VIEW.ox = off.ox; VIEW.toy = VIEW.oy = off.oy;
  moveSegInd(); measureLabels(); setLimits();
  if (S.level === 0 && !flight) rig.r = homeGoal(rig.theta).r * (S.ns ? 0.72 : 1);
}

// 캡처·점검용(화면에는 영향 없음)
function exposeHooks() {
  const proj = (v) => { const p = toScreen(v); return { x: p.x, y: p.y, z: p.z }; };
  window.__voc = {
    ready: true,
    state: () => ({ level: S.level, gid: S.gid, cid: S.cid, sid: S.sid, ns: S.ns, branch: S.branch }),
    idle: () => !flight,
    sample: () => M.sample,
    home: () => nav.universe({ reset: true }),
    northStar: () => nav.northStar(),
    galaxy: (id) => nav.galaxy(id),
    con: (id) => nav.con(id),
    star: (id) => nav.star(id),
    up: () => nav.up(),
    branch: (b) => setBranch(b),
    galaxyScreen: (id) => { const G = GAL_BY_ID.get(id); return G ? proj(G.group.getWorldPosition(new V3())) : null; },
    starScreen: (id) => { const s = M.starById.get(id); if (!s) return null; const G = GAL_BY_ID.get(s.galaxy), r = G.byStar.get(id); return proj(G.inner.localToWorld(r.pos.clone())); },
    picks: () => {
      // 캡처에 쓸 대표: 별자리가 가장 많은 은하 → 그 은하의 최우선 부정 별자리 → 그 별자리의 최근 별
      const neg = M.cons.filter((x) => !x.seed && x.polarity === 'neg');
      const c = neg.filter((x) => x.galaxy === '시설' && /샤워 후/.test(x.name)).sort((a, b) => b.stars.length - a.stars.length)[0]
        || neg.filter((x) => x.galaxy === '시설').sort(conOrder)[0] || neg.sort(conOrder)[0] || M.cons[0];
      const s = c ? c.stars[c.stars.length - 1] : M.stars[0];
      return { galaxy: c ? c.galaxy : GAL[0].id, con: c ? c.id : null, star: s ? s.id : null };
    },
    freeze: () => { tick(); CLOCK.scale = 0; },
    advance: (msAdd) => { CLOCK.t += msAdd; },
    resume: () => { tick(); CLOCK.scale = 1; },
    findStar: (kind) => {
      if (kind === 'orig') { const s = M.stars.find((x) => { const r = M.reviews[x.review_id]; return r && r.text_orig && r.text_ko && r.text_orig.trim() !== r.text_ko.trim(); }); return s ? s.id : null; }
      if (kind === 'cross') { for (const s of M.stars) { const sib = (M.starsByReview.get(s.review_id) || []).find((x) => x.id !== s.id && x.galaxy !== s.galaxy); if (sib) return { from: s.id, to: sib.id }; } return null; }
      if (kind === 'single') { const s = M.stars.find((x) => !x.con); return s ? s.id : null; }
      return null;
    },
    hover: () => (S.hover ? { ...S.hover } : null),
    reviewText: (sid) => { const s = M.starById.get(sid); const r = s && M.reviews[s.review_id]; return r ? { ko: r.text_ko || '', orig: r.text_orig || '' } : null; },
    panelOpen: () => !$('panel').hidden,
    view: () => ({ r: rig.r, phi: rig.phi, theta: rig.theta }),
  };
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
